server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users/**

        - id: portfolio-service
          uri: lb://portfolio-service
          predicates:
            - Path=/api/portfolios/**, /api/holdings/**

        - id: price-fetcher-service
          uri: lb://price-fetcher-service
          predicates:
            - Path=/api/prices/**

        - id: alert-service
          uri: lb://alert-service
          predicates:
            - Path=/api/alerts/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**

        - id: report-service
          uri: lb://report-service
          predicates:
            - Path=/api/reports/**

app:
  jwt:
    secret: ${JWT_SECRET}
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: "*"