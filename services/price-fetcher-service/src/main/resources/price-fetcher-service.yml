# stock-portfolio-config-repo/price-fetcher-service.yml
# Jason creates this — ask Shiva/Preethi to commit to config repo

server:
  port: 8084

spring:
  application:
    name: price-fetcher-service
  datasource:
    url: jdbc:mysql://localhost:3306/price_db
    username: root
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  cache:
    type: redis
    redis:
      time-to-live: 300000  # 5 minutes in ms

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

price:
  fetch:
    interval: 300000  # 5 minutes in ms
  external:
    api-key: ${FINNHUB_API_KEY:YOUR_FINNHUB_API_KEY}
    base-url: https://finnhub.io/api/v1/quote

logging:
  level:
    com.portfolio.pricefetcher: DEBUG
